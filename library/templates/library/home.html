{% extends "base.html" %}
{% block content %}
<div class="toolbar">
    <h1>Library</h1>
    <button hx-get="{% url 'library:create' 'folder' %}" hx-target="next .slot">+ Folder</button>
    <button hx-get="{% url 'library:create' 'playlist' %}" hx-target="next .slot">+ Playlist</button>
</div>
<div class="slot"></div>
<div id="tree" data-tree-url="{% url 'library:tree' %}" data-move-url="{% url 'library:move' %}">
    {% include "library/_tree.html" %}
</div>
{% endblock %}
