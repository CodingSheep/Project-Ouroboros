{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Project Ouroboros{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'library/style.css' %}">
    <script src="{% static 'library/vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'library/vendor/Sortable.min.js' %}" defer></script>
    <script src="{% static 'library/library.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header class="topbar">
        <a class="brand" href="{% url 'library:home' %}">Project Ouroboros</a>
        {% if user.is_authenticated %}
        <nav>
            <a href="{% url 'admin:index' %}">Admin</a>
            <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
        </nav>
        {% endif %}
    </header>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
