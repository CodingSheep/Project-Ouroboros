{% extends "base.html" %}
{% block title %}Log in · Project Ouroboros{% endblock %}
{% block content %}
<form method="post" class="login">
    {% csrf_token %}
    <h1>Log in</h1>
    {% if form.errors %}<p class="error">Wrong username or password.</p>{% endif %}
    <label>Username <input type="text" name="username" autofocus autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
</form>
{% endblock %}
